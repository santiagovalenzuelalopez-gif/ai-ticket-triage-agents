# Una sola imagen desplegada con tres roles: el orquestador llama a los especialistas por HTTP.
services:
  orchestrator:
    build: .
    ports: ["8080:8080"]
    environment:
      SERVICE_ROLE: orchestrator
      WEBHOOK_TOKEN: demo-webhook-token
      VISION_URL: http://vision:8080
      LOGS_URL: http://logs:8080
      SERVICE_AUTH: static
      SERVICE_TOKEN: demo-service-token
    depends_on: [vision, logs]

  vision:
    build: .
    environment:
      SERVICE_ROLE: vision
      SPECIALIST_TOKENS: demo-service-token

  logs:
    build: .
    environment:
      SERVICE_ROLE: logs
      SPECIALIST_TOKENS: demo-service-token
